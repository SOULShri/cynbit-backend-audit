<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cynbit Backend Architecture Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #10b981;
    }

    body.light-theme {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .title-area h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .title-area p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s;
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tabs {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0 24px;
      gap: 8px;
      flex-shrink: 0;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 12px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    #viewport {
      flex: 1;
      height: 100%;
      position: relative;
      background: radial-gradient(circle, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      overflow: hidden;
      cursor: grab;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #mermaid-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #mermaid-container svg {
      width: 100%;
      height: 100%;
    }

    .controls-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 4px;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .control-btn:hover {
      background-color: var(--border);
      color: var(--primary);
    }

    .sidebar {
      width: 360px;
      background-color: var(--card-bg);
      border-left: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .sidebar p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    .badge-observed { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-proposed { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-security { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }

    .bullet-list {
      list-style: none;
      margin-top: 12px;
    }

    .bullet-list li {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      padding-left: 18px;
      position: relative;
      line-height: 1.45;
    }

    .bullet-list li::before {
      content: "•";
      color: var(--primary);
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    .bullet-list strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="title-area">
      <h1>Cynbit Backend Architecture Visualizer</h1>
      <p>Interactive Architecture & Request Lifecycle Models</p>
    </div>
    <div class="header-actions">
      <button class="btn" id="theme-toggle">🌓 Toggle Theme</button>
      <a class="btn" href="https://github.com/SOULShri/cynbit-backend-audit" target="_blank">GitHub Repository ↗</a>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-diagram="observed">1. Observed Request Flow</button>
    <button class="tab-btn" data-diagram="recommended">2. Recommended Architecture</button>
    <button class="tab-btn" data-diagram="security">3. Security Request Lifecycle</button>
  </nav>

  <main>
    <div id="viewport">
      <div id="mermaid-container"></div>
      <div class="controls-overlay">
        <button class="control-btn" id="btn-zoom-in" title="Zoom In">+</button>
        <button class="control-btn" id="btn-zoom-out" title="Zoom Out">−</button>
        <button class="control-btn" id="btn-reset" title="Reset View">⟲</button>
      </div>
    </div>

    <aside class="sidebar">
      <div id="sidebar-content">
        <!-- Injected via JavaScript -->
      </div>
    </aside>
  </main>

  <script>
    const diagrams = {
      observed: {
        badgeClass: "badge-observed",
        badgeText: "Empirical Observation",
        title: "Observed Request Flow",
        description: "Captures the client-to-server RPC protocol on the /contact route verified through passive inspection of public JavaScript bundles. Server-side processing beyond the Next.js Server Action is unobservable from the outside.",
        bullets: [
          "<strong>Transport:</strong> Direct HTTPS POST to /contact with Next-Action RPC header.",
          "<strong>No Public REST API:</strong> The contact form does NOT communicate with a traditional /api/contact endpoint.",
          "<strong>Client Bundle:</strong> Action ID 40247ba4... extracted from contact/page-*.js.",
          "<strong>Edge POP:</strong> Terminated at Vercel's Mumbai node (bom1) with sub-50ms ISR delivery.",
          "<strong>Unverified Boundary:</strong> Database persistence and email dispatch are unconfirmed."
        ],
        code: `sequenceDiagram
    autonumber
    actor User as Client Browser
    participant Edge as Vercel Edge Network (Mumbai POP)
    participant NextApp as Next.js App Router
    participant Action as submitInquiry Server Action (ID: 40247ba4...)
    participant Backend as Unverified Backend Services (CRM / Email / DB)

    User->>Edge: GET /contact (HTTPS / TLS 1.3)
    Edge-->>User: 200 OK (ISR Pre-rendered HTML, 49ms, 64 KB)
    Note over User: User inputs: fullName, email, company, industry, message
    User->>Edge: POST /contact (multipart/form-data)
    Note over User,Edge: Header: Next-Action: 40247ba4465344b3386595bab4303317cdcce907df
    Edge->>NextApp: Forward RPC payload to Serverless Function
    NextApp->>Action: Execute submitInquiry(formData)
    Action-)Backend: Internal persistence / email dispatch (Unobservable)
    Backend--)Action: Internal status returned
    Action-->>NextApp: Return status { success: boolean }
    NextApp-->>Edge: React Server Component streaming payload
    Edge-->>User: Client state updated (Render success or error banner)`
      },

      recommended: {
        badgeClass: "badge-proposed",
        badgeText: "Recommended Target Architecture",
        title: "Decoupled High-Throughput Topology",
        description: "A target architectural blueprint separating presentation, gateway routing, application domains, distributed caching, and persistence into discrete layers.",
        bullets: [
          "<strong>Edge & Ingress:</strong> Edge WAF, bot detection, and strict security header injection.",
          "<strong>API Gateway:</strong> Centralized correlation IDs (x-request-id) and strict CORS whitelisting.",
          "<strong>Application Services:</strong> Clean separation using Controller-Service-Repository pattern.",
          "<strong>Distributed Rate Limiting:</strong> Redis-backed fixed-window counter with atomic Lua execution.",
          "<strong>Data Layer:</strong> PostgreSQL 16 with PgBouncer connection pooling and read-through caching."
        ],
        code: `graph TB
    subgraph Client_Layer ["1. Client & Ingress Tier"]
        Client["Web / Mobile Clients"]
        EdgeWAF["Edge CDN & WAF (Cloudflare / Vercel Edge)<br/>• Edge Rate Limiting & Bot Filtering<br/>• Strict Security Headers (CSP, HSTS)"]
    end
    subgraph Gateway_Layer ["2. API Gateway & Middleware Pipeline"]
        Gateway["Reverse Proxy & Gateway<br/>• Correlation ID (x-request-id)<br/>• Strict CORS Whitelist"]
        RateLimit["Rate Limiting Middleware<br/>• Atomic Lua Counter (PTTL)<br/>• RFC 9333 Headers"]
        AuthGuard["JWT & RBAC Guard<br/>• jose HS256 Verification<br/>• 60s Clock-Skew Tolerance"]
    end
    subgraph App_Layer ["3. Application Services Tier"]
        Controller["Inquiry Controller<br/>• Standardized ApiResponse envelope"]
        Validation["Zod Validation Layer<br/>• Unicode name support<br/>• Honeypot trapping"]
        Service["Inquiry Business Service<br/>• Domain logic & async job dispatch"]
        Repository["Inquiry Repository<br/>• Prisma ORM query builder"]
    end
    subgraph Cache_Queue ["4. Cache & Async Worker Tier"]
        Redis[("Redis Cluster<br/>• Rate limits & session revocation<br/>• Read-through cache")]
        BullMQ["BullMQ / Message Queue<br/>• Transactional email queue"]
        Workers["Background Workers<br/>• Email & webhook dispatch"]
    end
    subgraph Persistence_Layer ["5. Data Persistence Tier"]
        PgBouncer["Connection Pooler (PgBouncer)"]
        Postgres[("PostgreSQL 16 (Primary OLTP)")]
    end
    Client --> EdgeWAF --> Gateway --> RateLimit --> AuthGuard --> Controller --> Validation --> Service --> Repository
    RateLimit -.-> Redis
    AuthGuard -.-> Redis
    Repository -.-> Redis
    Service -.-> BullMQ --> Workers
    Repository --> PgBouncer --> Postgres`
      },

      security: {
        badgeClass: "badge-security",
        badgeText: "Security & Validation Lifecycle",
        title: "Request Processing Pipeline",
        description: "Details defense-in-depth enforcement from the perimeter rate limiter through cryptographic token validation, role authorization, input sanitization, and database error masking.",
        bullets: [
          "<strong>1. Throttling:</strong> Request checked against Redis counter. HTTP 429 returned if exceeded.",
          "<strong>2. Authentication:</strong> Timing-safe JWT check (HS256 allowlist, 32+ byte key, 60s clock skew).",
          "<strong>3. Fault Isolation:</strong> Redis revocation outage returns HTTP 503 rather than misreporting 401.",
          "<strong>4. Authorization:</strong> Strict RBAC middleware (requireRoles) blocks unauthorized callers (403).",
          "<strong>5. Input Sanitization:</strong> Zod safeParseAsync strips honeypot spam and validates Unicode names.",
          "<strong>6. Error Masking:</strong> Centralized handler intercepts database constraints (Prisma P-codes)."
        ],
        code: `sequenceDiagram
    autonumber
    actor Client as API Consumer
    participant Gateway as API Gateway
    participant RL as Rate Limiter (Redis)
    participant Auth as JWT Guard (jose)
    participant RBAC as Role Guard
    participant Val as Zod Validator
    participant Svc as Business Service
    participant Err as Error Handler

    Client->>Gateway: POST /api/v1/inquiries (Bearer + JSON)
    Gateway->>RL: Check IP rate threshold
    alt Limit Exceeded
        RL-->>Client: 429 Too Many Requests (RateLimit-Reset, Retry-After)
    else Within Limit
        RL->>Auth: Pass request
        Auth->>Auth: Verify JWT signature & clock-skew
        alt Redis Revocation Store Down
            Auth-->>Client: 503 Service Unavailable
        else Token Valid
            Auth->>RBAC: Forward req.user
            alt Lacks Permitted Role
                RBAC-->>Client: 403 Forbidden
            else Authorized
                RBAC->>Val: Forward payload
                alt Validation / Honeypot Fails
                    Val-->>Client: 400 Bad Request
                else Valid Input
                    Val->>Svc: Execute business logic
                    alt Database Error
                        Svc->>Err: Bubble error
                        Err-->>Client: 500 Internal Server Error (Masked)
                    else Success
                        Svc-->>Client: 201 Created (ApiResponse)
                    end
                end
            end
        end
    end`
      }
    };

    let currentDiagramKey = "observed";
    let panZoomInstance = null;
    let isDark = true;

    function initMermaid() {
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose',
        flowchart: { curve: 'basis', htmlLabels: true },
        sequence: { mirrorActors: false, useMaxWidth: true }
      });
    }

    async function renderDiagram(key) {
      currentDiagramKey = key;
      const data = diagrams[key];

      // Update sidebar
      const sidebar = document.getElementById("sidebar-content");
      sidebar.innerHTML = \`
        <span class="badge \${data.badgeClass}">\${data.badgeText}</span>
        <h2>\${data.title}</h2>
        <p>\${data.description}</p>
        <ul class="bullet-list">
          \${data.bullets.map(b => \`<li>\${b}</li>\`).join('')}
        </ul>
      \`;

      // Render mermaid SVG
      const container = document.getElementById("mermaid-container");
      container.innerHTML = "";

      if (panZoomInstance) {
        panZoomInstance.destroy();
        panZoomInstance = null;
      }

      const id = "mermaid-svg-" + Date.now();
      try {
        const { svg } = await mermaid.render(id, data.code);
        container.innerHTML = svg;

        const svgElement = container.querySelector("svg");
        svgElement.style.maxWidth = "100%";
        svgElement.style.height = "100%";

        panZoomInstance = svgPanZoom(svgElement, {
          zoomEnabled: true,
          controlIconsEnabled: false,
          fit: true,
          center: true,
          minZoom: 0.2,
          maxZoom: 8
        });
      } catch (err) {
        container.innerHTML = \`<div style="color: #ef4444; padding: 20px;">Render Error: \${err.message}</div>\`;
      }
    }

    // Tabs
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderDiagram(btn.getAttribute("data-diagram"));
      });
    });

    // Controls
    document.getElementById("btn-zoom-in").addEventListener("click", () => panZoomInstance && panZoomInstance.zoomIn());
    document.getElementById("btn-zoom-out").addEventListener("click", () => panZoomInstance && panZoomInstance.zoomOut());
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (panZoomInstance) {
        panZoomInstance.reset();
        panZoomInstance.center();
      }
    });

    // Theme toggle
    document.getElementById("theme-toggle").addEventListener("click", () => {
      isDark = !isDark;
      document.body.classList.toggle("light-theme", !isDark);
      initMermaid();
      renderDiagram(currentDiagramKey);
    });

    // Init
    initMermaid();
    renderDiagram("observed");
  </script>
</body>
</html>
